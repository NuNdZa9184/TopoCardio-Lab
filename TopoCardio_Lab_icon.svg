<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="48%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0d253f" />
      <stop offset="60%" stop-color="#071526" />
      <stop offset="100%" stop-color="#030a14" />
    </radialGradient>

    <!-- Subtle icon frame border -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4976" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#102a45" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b2667" stop-opacity="0.55" />
    </linearGradient>

    <!-- ECG Left Heart & Wave Gradient (Coral Red to Amber Orange) -->
    <linearGradient id="ecgGrad" x1="80" y1="260" x2="262" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff245b" />
      <stop offset="55%" stop-color="#ff5733" />
      <stop offset="100%" stop-color="#ff9924" />
    </linearGradient>

    <!-- TDA Right Attractor Gradient (Electric Cyan to Violet Purple) -->
    <linearGradient id="tdaGrad" x1="255" y1="395" x2="415" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="iconClip">
      <rect x="36" y="36" width="440" height="440" rx="96" ry="96" />
    </clipPath>
  </defs>

  <!-- App Icon Rounded Square Base -->
  <rect x="36" y="36" width="440" height="440" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#frameGrad)" stroke-width="2" />

